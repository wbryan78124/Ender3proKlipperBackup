[include KAMP_Settings.cfg]

[gcode_macro UNSAFE_BED_RAISE]
description: Lower the bed 10mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=0
  G0 Z10 F600
  M84

[gcode_macro UNSAFE_BED_LOWER]
description: Lower the bed 10mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=0
  G0 Z-10 F600
  M84

[gcode_macro Cold_Pull]
description: extruder cold clean
gcode:
  G90 #use absolute coordinates
  M83 #extruder relative mode
  M109 S200 #Wait until working temperature reached
  G4 P10000 #Pause for 10 seconds
  G1 E20 F300 #Extrude a bit of filament to fill the nozzle with fresh filament
  M109 S190 #Cool to 190
  G1 E5 F100 #Extrude a bit of filament to fill the nozzle in case it dripped
  G92 E0
  M106 S255 #Turn the fan on to cool the hotend faster
  M109 S150 #Cool to 90
  M106 S0 #Turn the fan off
  M117 #Pull filament now ; Display this message
  G1 E-75 F4000  #Run the extruder backwards
  M104 S0  #Turn hotend off
  M84 #disable motors required to prevent printer believing file is incomplete 

[gcode_macro DO_MELODY]
gcode:
  # Approximation of LG washer "Life's Good" melody
  {% set melody   = [  987, 1318, 1175, 880, 987, 0, 880, 784, 880, 987, 0, 1318, 1175, 987 ] %}
  {% set duration = [  200,  200,  200, 200, 400, 200, 200, 200, 200, 400, 200,  200,  200, 400 ] %}
  {% for note in melody %}
    {% if note > 0 %}
      SET_PIN PIN=BEEP_PIN VALUE=0.5 CYCLE_TIME={1 / note}
      G4 P{duration[loop.index-1]}
      SET_PIN PIN=BEEP_PIN VALUE=0
    {% else %}
      # Rest (silence)
      G4 P{duration[loop.index-1]}
    {% endif %}
  {% endfor %}
  SET_PIN PIN=BEEP_PIN VALUE=0


[gcode_macro START_PRINT]
gcode:
    G92 E0
    G28 ; Home
    {% set speed = params.SPEED|default(0.5)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(65)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(225)|float %}
    # LEVEL_BED_ADVANCED MAX_AGE=10 ; probe mesh eventually
    BED_MESH_CALIBRATE
    M109
    LINE_PURGE
    #G92 E0 ; Reset Extruder
    #G1 X0.0 Y20.0 Z0.2 F5000.0 ; Move to start position at X1.0, Y20
    #G1 X0.0 Y100.0 Z0.2 F1500.0 E15 ; Draw first purge line up to Y100 while extruding 15mm
    #G1 X0.4 Y100.0 Z0.2 F5000.0 ; Shift slightly over
    #G1 X0.4 Y20.0 Z0.2 F1500.0 E30 ; Draw second return purge line back to Y20
    #G92 E0 ; Reset Extruder
    #G1 Z2.0 F3000 ; Move Z up a bit
    
  
   
    # ... whatever else you want to do before print

[gcode_macro END_PRINT]
gcode:
    G91 ; Relative positioning
    G1 E-1 F120 ; Retract
    G1 F3000 Z10 ; Move up
    G90 ; Absolute pos.
    G1 X50 Y230 ; present print
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    #SAVE_IF_SET     ; SAVE_CONFIG if a mesh was probed in START_PRINT
    M84 ; Disable steppers

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 75      # Distance to retract filament from the extruder
variable_nozzle_preheat_temp: 160 # Default preheat temperature for unloading
variable_turn_off_extruder: True   # Option to turn off the extruder after unloading (True/False)
gcode:
    # Parameters and settings
    {% set retract_speed = params.RETRACT_SPEED|default(600) %}  # Speed for retracting filament
    {% set target_temp = params.TARGET_TEMP|default(180) %}  # Target temperature for the nozzle
    {% set min_temp = params.MIN_TEMP|default(180) %}  # Minimum safe temperature for extrusion

    # Save current state of the printer
    SAVE_GCODE_STATE NAME=unload_state

    # Heat the nozzle to the target temperature if required
    {% if printer.extruder.temperature < target_temp %}
        # Ensure the nozzle is heated to the target temperature or at least the minimum safe temperature
        {% if target_temp >= min_temp %}
            M104 S{target_temp} ; Set extruder to target temperature
            M109 S{target_temp} ; Wait for extruder to reach target temperature
        {% else %}
            M104 S{min_temp} ; Set extruder to safe minimum temperature
            M109 S{min_temp} ; Wait for extruder to reach safe minimum temperature
        {% endif %}
    {% endif %}

    # Begin filament unloading process
    G91 ; Set relative positioning for extrusion
    G92 E0 ; Reset extruder position
    G1 E-{unload_distance} F{retract_speed} ; Retract filament at the specified speed

    # Optionally turn off the extruder heater after unloading
    {% if turn_off_extruder %}
        M104 S0 ; Turn off extruder heater
    {% endif %}

    # Restore previous state of the printer
    G90 ; Restore absolute positioning
    RESTORE_GCODE_STATE NAME=unload_state

    # Completion message
    M117 Filament unload complete

[gcode_macro LOAD_FILAMENT]
variable_load_distance: 50         # Distance to load filament into the extruder
variable_purge_distance: 30        # Distance to purge filament after loading
variable_nozzle_preheat_temp: 220  # Default preheat temperature for the nozzle
variable_turn_off_extruder: True   # Option to turn off the extruder after loading (True/False)
gcode:
    # Parameters and settings
    {% set load_speed = params.LOAD_SPEED|default(600) %}  # Speed in mm/min for fast filament loading
    {% set purge_speed = params.PURGE_SPEED|default(300) %}  # Speed in mm/min for purging filament
    {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp) %}  # Target temperature for the nozzle
    {% set min_temp = params.MIN_TEMP|default(180) %}  # Minimum safe temperature for extrusion

    # Save current state of the printer
    SAVE_GCODE_STATE NAME=load_state

    # Heat directly to the target temperature if it's above the minimum temperature
    {% if target_temp >= min_temp %}
        M104 S{target_temp} ; Set extruder to target temperature
        M109 S{target_temp} ; Wait for extruder to reach target temperature
    {% else %}
        # Heat to minimum temperature first if target is too low
        M104 S{min_temp} ; Set extruder to safe minimum temperature
        M109 S{min_temp} ; Wait for extruder to reach safe minimum temperature
    {% endif %}

    # Begin filament loading process
    G91 ; Set relative positioning for extrusion
    G92 E0 ; Reset extruder position
    G1 E{load_distance} F{load_speed} ; Load filament at the specified loading speed
    G1 E{purge_distance} F{purge_speed} ; Purge filament at the slower purging speed
    M109 S150 ; Wait for extruder to reach target temperature
    G1 E-2 F120

    # Optionally turn off the extruder heater after loading
    {% if turn_off_extruder %}
        M104 S0 ; Turn off extruder heater
    {% endif %}

    # Restore previous state of the printer
    G90 ; Restore absolute positioning
    RESTORE_GCODE_STATE NAME=load_state

    # Completion message
    M117 Filament load complete